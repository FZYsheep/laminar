hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - async_rl_base
  - _self_

algorithm:
  rollout_correction:
    bypass_mode: true
    loss_type: reinforce
    score_centering: true
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false
    rollout_rs: null

actor_rollout_ref:
  model:
    use_remove_padding: true
    use_fused_kernels: false
  rollout:
    calculate_log_probs: true
    topk_log_probs: 32
    temperature: 1.0
